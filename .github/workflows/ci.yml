name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, unit tests, Electron E2E and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      ELECTRON_DISABLE_SECURITY_WARNINGS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install OS dependencies for headless Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libnss3 libgbm1 libgtk-3-0 libasound2t64 libxss1
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Unit and security tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Electron IPC and security E2E
        run: npm run e2e
      - name: Electron UI E2E
        run: npm run e2e:ui
